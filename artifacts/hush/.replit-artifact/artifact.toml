kind = "mobile"
previewPath = "/hush-mobile-archive/"
title = "Hush Mobile Archive"
description = "Archived native Hush build. The active, website-only Hush experience is served at the root path."
version = "1.0.0"
id = "artifacts/hush"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/hush-mobile-archive/" ]
localPort = 24656

[services.development]
run = "pnpm --filter @workspace/hush run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hush", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/hush", "run", "serve" ]

[services.env]
PORT = "24656"
BASE_PATH = "/hush-mobile-archive/"
