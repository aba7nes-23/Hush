kind = "web"
previewPath = "/3d-game/"
title = "Crossy Road"
description = "A single-player 3D endless road-crossing arcade game: guide a little hopper across grass, traffic lanes, and streams while avoiding moving hazards. Includes keyboard and touch controls, score and best score, pause, and restart; no account or backend required."
version = "1.0.0"
id = "artifacts/3d-game"
router = "path"

[[services]]
name = "web"
paths = [ "/3d-game/" ]
localPort = 24982

[services.development]
run = "pnpm --filter @workspace/3d-game run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/3d-game", "run", "build" ]
serve = "static"
publicDir = "artifacts/3d-game/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24982"
BASE_PATH = "/3d-game/"
